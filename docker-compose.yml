services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ragrun-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  embedding-service:
    build:
      context: .
      dockerfile: personal-embeddings-service/Dockerfile
      args:
        RAGKEEP_PROJECT_ROOT: ragkeep
    container_name: ragrun-embeddings
    environment:
      USE_HALF_PRECISION: "false"
      EMBEDDINGS_MODEL_NAME: "intfloat/multilingual-e5-large"
      EMBEDDINGS_ALLOWED_MODELS: '["T-Systems-onsite/cross-en-de-roberta-sentence-transformer","intfloat/multilingual-e5-large","BAAI/bge-m3"]'
    ports:
      - "8001:8001"
    volumes:
      - embeddings-model-cache:/app/models
    depends_on:
      - qdrant

  ragrun-api:
    build:
      context: .
      args:
        RAGKEEP_PROJECT_ROOT: ragkeep
    container_name: ragrun-api
    env_file:
      - .env
    environment:
      RAGRUN_APP_ENV: docker
      RAGRUN_QDRANT_URL: http://qdrant:6333
      RAGRUN_POSTGRES_DSN: postgresql+psycopg://postgres.rmdqihhjjyizbuhxkxhn:j2hT2fWwHCjx_AKyDB%2Ac@aws-1-eu-north-1.pooler.supabase.com:5432/postgres
      RAGRUN_EMBEDDINGS_BASE_URL: http://embedding-service:8001
      RAGRUN_DEEPSEEK_API_KEY: ${RAGRUN_DEEPSEEK_API_KEY}
      RAGRUN_PERSONALITIES_ROOT: /personalities
    ports:
      - "8000:8000"
    volumes:
      - /Users/michael/Reniets/Ai/ragrun-personalities:/personalities:ro
    depends_on:
      - qdrant
      - embedding-service

volumes:
  qdrant-data:
  embeddings-model-cache:
