# Standalone ragscribe on Tuxai. Separate from deploy/tuxai/compose.yaml
# so Qdrant / embedder are not restarted with this stack.
#
# Joins external network ragrun-server_default to reach production Qdrant.
# Set QDRANT_API_KEY in the environment (same as ~/ragrun-server/.env).
#
# From repo root on Tuxai:
#   export QDRANT_API_KEY=…
#   docker compose -f deploy/tuxai/ragscribe/compose.yaml up -d --build

services:
  ragscribe:
    build:
      # Synced tree on Tuxai is ~/ragscribe (not under ragrun-server).
      context: /home/michael/ragscribe
      dockerfile: Dockerfile
    container_name: ragscribe
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      WHISPER_MODEL: medium
      WHISPER_DEVICE: cpu
      WHISPER_DOWNLOAD_ROOT: /root/.cache/whisper
      WHISPER_LOG_LEVEL: INFO
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ragscribe-whisper-cache:/root/.cache/whisper
      - ragscribe-hf-cache:/root/.cache/huggingface
    networks:
      - default
      - ragrun

volumes:
  ragscribe-whisper-cache:
  ragscribe-hf-cache:

networks:
  ragrun:
    external: true
    name: ragrun-server_default
