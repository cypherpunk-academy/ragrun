global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: qdrant
    authorization:
      credentials_file: /etc/prometheus/qdrant_key
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: embedder
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-service:8001"]
