# Monitoring für den Pulse. Eigenes Compose-Projekt ragrun-monitoring.
# Tritt dem Netz von deploy/tuxai/compose.yaml bei und ändert das dort nicht.
# Image-Tags geprüft am 13.10.2026 (Prometheus Download, Grafana Hub, node_exporter, cAdvisor-Release).
# cAdvisor liegt nicht mehr aktuell auf Docker Hub; das Release-Image ist ghcr.io/google/cadvisor.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    ports:
      - ${TAILSCALE_IP}:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./qdrant_key:/etc/prometheus/qdrant_key:ro
      - prometheus-data:/prometheus
    networks:
      - ragrun

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - ${TAILSCALE_IP}:3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ragrun

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - ragrun

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - ragrun

volumes:
  prometheus-data:
  grafana-data:

networks:
  ragrun:
    external: true
    name: ragrun-server_default
