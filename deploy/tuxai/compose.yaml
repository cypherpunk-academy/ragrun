services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:6333:6333"
      - "${TAILSCALE_IP}:6334:6334"
      - "127.0.0.1:6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - ${QDRANT_STORAGE_DIR}:/qdrant/storage

  embedding-service:
    build:
      context: ../../personal-embeddings-service
      dockerfile: Dockerfile
    container_name: ragrun-embeddings
    restart: unless-stopped
    environment:
      USE_HALF_PRECISION: "false"
      EMBEDDINGS_MODEL_NAME: "intfloat/multilingual-e5-large"
      EMBEDDINGS_ALLOWED_MODELS: '["T-Systems-onsite/cross-en-de-roberta-sentence-transformer","intfloat/multilingual-e5-large","BAAI/bge-m3"]'
      HF_HOME: /app/models
      SENTENCE_TRANSFORMERS_HOME: /app/models
    ports:
      - "${TAILSCALE_IP}:8001:8001"
      - "127.0.0.1:8001:8001"
    volumes:
      - embeddings-model-cache:/app/models
    depends_on:
      - qdrant

volumes:
  embeddings-model-cache:
