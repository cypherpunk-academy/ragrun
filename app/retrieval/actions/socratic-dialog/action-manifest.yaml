id: socratic-dialog
label: Sokratischer Dialog
description: Prüfender Dialog – findet Denkfehler, Unklarheiten und Widersprüche zu den Primärquellen.

requires_retrieval: true
requires_prompt: true

position-in-chat: [start, continue]

queries:
  - name: primary
    chunk_types: [book]
    k: 8
    method: hybrid

  - name: secondary
    chunk_types: [secondary_book, essay, talk, explanation]
    k: 6
    method: dense

  - name: quotes
    chunk_types: [quote]
    k: 3
    method: dense

  - name: concepts
    chunk_types: [begriff, typology]
    method: lemma-lookup

follow_ups:
  - action_id: socratic-dialog
  - action_id: summarize
    condition: "turn_count >= 3"
  - action_id: save-dialog
    condition: "turn_count >= 3"
  - action_id: give-feedback
