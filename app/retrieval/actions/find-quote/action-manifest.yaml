id: find-quote
label: Zitat suchen
description: Zitat oder Belegstelle zu einem Thema finden.

requires_retrieval: true
requires_prompt: true

position-in-chat: [start, continue]
allows-empty-prompt: true

queries:
  - name: quotes
    chunk_types: [quote]
    k: 5
    method: hybrid
    parallel_with: steiner-books

  - name: steiner-books
    chunk_types: [book, secondary_book]
    k: 5
    method: hybrid
    author: "Rudolf Steiner"
    parallel_with: quotes

follow_ups:
  - action_id: find-quote
    allows-empty-prompt: true
  - action_id: find-in-works
    allows-empty-prompt: true
  - action_id: socratic-dialog
  - action_id: summarize
    condition: "turn_count >= 3"
  - action_id: give-feedback
