id: general-question
label: Allgemeine Frage
description: Breite Erklärung, Vergleich, Vertiefung zu einem Thema.

requires_retrieval: true
requires_prompt: true

position-in-chat: [start, continue]

queries:
  - name: primary-books
    chunk_types: [book]
    k: 8
    method: hybrid

  - name: secondary-books
    chunk_types: [secondary_book, chapter_summary, essay, talk]
    k: 8
    method: dense

  - name: concepts
    chunk_types: [begriff,typology]
    method: lemma-lookup

  - name: quotes
    chunk_types: [quote]
    k: 5
    method: hybrid

follow_ups:
  - action_id: socratic-dialog
  - action_id: find-quote
    allows-empty-prompt: true
  - action_id: find-in-works
    allows-empty-prompt: true
  - action_id: clarify-concept
  - action_id: summarize
    condition: "turn_count >= 3"
  - action_id: give-feedback
